version: 2

sources:
  - name: ecommerce
    description: "Raw e-commerce data stored in Supabase PostgreSQL"
    database: postgres
    schema: public

    tables:
      - name: customers
        description: "Customer information"

      - name: orders
        description: "Customer orders"
        config:
          loaded_at_field: updated_at
          freshness:
            warn_after:
              count: 1
              period: day
            error_after:
              count: 2
              period: day

      - name: order_items
        description: "Products associated with each order"